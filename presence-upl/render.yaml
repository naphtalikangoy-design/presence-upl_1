databases:
  - name: upl-presence-db
    plan: free
    databaseName: presence_upl
    user: presence_user

services:
  - type: web
    name: presence-upl
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: upl-presence-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
